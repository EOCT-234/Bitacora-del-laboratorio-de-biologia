<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora Diaria - Laboratorio de Biología</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Bitácora Diaria – Laboratorio de Biología</h1>
      <p class="description">
        Registro obligatorio de ingreso, personal asignado, uso de equipamiento, actividades ejecutadas y hora de salida.
      </p>
    </header>

    <!-- Formulario configurado con ambos correos -->
    <form id="bitacoraForm" action="https://formsubmit.co/campostroyesedgar@gmail.com,vichas.camtro@gamil.com" method="POST" onsubmit="enviarWhatsAppOpcional(event)">
      
      <!-- Configuración oculta para FormSubmit -->
      <input type="hidden" name="_subject" value="Nuevo Registro: Bitácora Lab. Biología">
      <input type="hidden" name="_template" value="table">

      <!-- Sección 1: Ingreso y Personal -->
      <fieldset>
        <legend>1. Datos de Ingreso y Personal</legend>
        
        <div class="grid-row">
          <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="Fecha" required>
          </div>
          <div class="form-group">
            <label for="hora_ingreso">Hora de ingreso:</label>
            <input type="time" id="hora_ingreso" name="Hora de Ingreso" required>
          </div>
        </div>

        <div class="form-group">
          <label for="responsable">Responsable / Encargado del turno:</label>
          <input type="text" id="responsable" name="Responsable del Turno" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
          <label for="personal">Personal o estudiantes presentes:</label>
          <textarea id="personal" name="Personal Presente" rows="2" placeholder="Si no hay nadie más, volver a escribir su nombre aquí" required></textarea>
        </div>
      </fieldset>

      <!-- Sección 2: Equipos -->
      <fieldset>
        <legend>2. Equipos a Usar</legend>
        
        <div class="form-group">
          <label>Seleccionar equipos requeridos:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="Equipos[]" value="Microscopios / Estereoscopios"> Microscopios / Estereoscopios</label>
            <label class="checkbox-item"><input type="checkbox" name="Equipos[]" value="Centrífuga"> Centrífuga / Ultracentrífuga</label>
            <label class="checkbox-item"><input type="checkbox" name="Equipos[]" value="Estufa"> Estufa</label>
          </div>
        </div>

        <div class="form-group">
          <label for="otros_equipos">Otros equipos a usar:</label>
          <input type="text" id="otros_equipos" name="Otros equipos a usar" placeholder="Ingrese aquí el equipo que no esté enlistado">
        </div>
      </fieldset>

      <!-- Sección 3: Materiales/Reactivos -->
      <fieldset>
        <legend>3. Materiales / Reactivos a Usar</legend>
        
        <div class="form-group">
          <label>Seleccionar materiales requeridos:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="Materiales[]" value="Agua destilada"> Agua destilada</label>
            <label class="checkbox-item"><input type="checkbox" name="Materiales[]" value="Placas petri"> Placas petri</label>
            <label class="checkbox-item"><input type="checkbox" name="Materiales[]" value="Vaso de precipitado"> Vaso de precipitado</label>
            <label class="checkbox-item"><input type="checkbox" name="Materiales[]" value="Cinta parafilm"> Cinta parafilm</label>
          </div>
        </div>

        <div class="form-group">
          <label for="otros_materiales">Otros materiales/reactivos a usar:</label>
          <input type="text" id="otros_materiales" name="Otros materiales/reactivos a usar" placeholder="Ej. Reactivos controlados, cepas, tinción...">
        </div>
      </fieldset>

      <!-- Sección 4: Actividades -->
      <fieldset>
        <legend>4. Actividades a Realizar</legend>
        
        <div class="form-group">
          <label>Área / Proyecto:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="Área / Proyecto[]" value="Sala de siembra"> Sala de siembra</label>
            <label class="checkbox-item"><input type="checkbox" name="Área / Proyecto[]" value="Sala de incubación"> Sala de incubación</label>
            <label class="checkbox-item"><input type="checkbox" name="Área / Proyecto[]" value="Sala de trabajo del laboratorio"> Sala de trabajo del laboratorio</label>
            <label class="checkbox-item"><input type="checkbox" name="Área / Proyecto[]" value="Almacén"> Almacén</label>
            <label class="checkbox-item"><input type="checkbox" name="Área / Proyecto[]" value="Oficina"> Oficina</label>
          </div>
        </div>

        <div class="form-group">
          <label for="actividades">Detalle de las actividades ejecutadas:</label>
          <textarea id="actividades" name="Detalle de Actividades" rows="4" placeholder="Describa brevemente el procedimiento o ensayo a realizar..." required></textarea>
        </div>
      </fieldset>

      <!-- Sección 5: Cierre y Salida -->
      <fieldset>
        <legend>5. Cierre y Salida</legend>
        
        <div class="form-group">
          <label for="hora_salida">Hora de salida:</label>
          <input type="time" id="hora_salida" name="Hora de Salida" required>
        </div>

        <div class="form-group">
          <label>Verificación de bioseguridad y orden:</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="Cierre[]" value="Equipos apagados"> Equipos apagados y desconectados</label>
            <label class="checkbox-item"><input type="checkbox" name="Cierre[]" value="Mesas desinfectadas"> Mesas y superficies desinfectadas</label>
            <label class="checkbox-item"><input type="checkbox" name="Cierre[]" value="Residuos descartados"> Residuos biológicos descartados</label>
            <label class="checkbox-item"><input type="checkbox" name="Cierre[]" value="Acceso cerrado"> Puertas y ventanas aseguradas</label>
          </div>
        </div>

        <div class="form-group">
          <label for="incidencias">Observaciones o incidencias:</label>
          <textarea id="incidencias" name="Observaciones / Incidencias" rows="2" placeholder="Reportar fallas de equipos, insumos agotados, etc."></textarea>
        </div>
      </fieldset>

      <button type="submit">Enviar Bitácora al Correo</button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. BLOQUEAR FECHAS PASADAS (Solo permite fechas de hoy en adelante)
      const inputFecha = document.getElementById('fecha');
      const hoy = new Date();
      
      const year = hoy.getFullYear();
      const month = String(hoy.getMonth() + 1).padStart(2, '0');
      const day = String(hoy.getDate()).padStart(2, '0');
      
      const fechaActual = `${year}-${month}-${day}`;
      inputFecha.min = fechaActual;
      inputFecha.value = fechaActual;
    });
  </script>

</body>
</html>
